<style>

  h1, h2, h3, .section-header { font-family:'Jua','Gaegu',sans-serif; letter-spacing:.5px; }
  header { background:linear-gradient(135deg,#d97757 0%,#e89e7c 100%); color:#fff; padding:calc(.45rem + env(safe-area-inset-top)) 1rem .5rem; box-shadow:0 2px 8px rgba(0,0,0,.08); position:sticky; top:0; z-index:100; }
  header h1 { margin:0; font-size:1rem; line-height:1.35; }
  header .subtitle { margin:0; font-size:.7rem; line-height:1.3; opacity:.9; }
  .progress-wrap { margin-top:.35rem; background:rgba(255,255,255,.25); border-radius:999px; height:6px; overflow:hidden; }
  .progress-bar { background:#fff; height:100%; width:0; transition:width .4s ease; border-radius:999px; }
  .progress-text { margin:.15rem 0 0; font-size:.7rem; line-height:1.3; opacity:.95; }
  .container { max-width:800px; margin:0 auto; padding:1rem 1rem 4rem; position:relative; z-index:10; }
  .toolbar { display:flex; flex-wrap:wrap; gap:.5rem; margin:.5rem 0 1rem; }
  .toolbar button { flex:1 1 40%; min-width:0; padding:.5rem .75rem; background:#fff; border:1px solid var(--border); border-radius:8px; font:inherit; font-size:.9rem; cursor:pointer; color:var(--text); }
  .toolbar button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .legend { font-size:.8rem; color:var(--muted); margin:0 0 1rem; }
  .section { margin-bottom:1.2rem; }

  .section-note { padding:.6rem 1rem; font-size:.85rem; background:#fff8e6; border-bottom:1px solid var(--border); }
  .item { border-top:1px solid var(--border); }
  .item:first-child { border-top:none; }
  .item.hidden { display:none; }
  .item-header { display:flex; align-items:flex-start; gap:.6rem; padding:.8rem .8rem .8rem 1rem; cursor:pointer; user-select:none; }
  .item-check { flex-shrink:0; width:1.3rem; height:1.3rem; border:2px solid var(--border); border-radius:8px; display:flex; align-items:center; justify-content:center; background:#fff; margin-top:1px; transition:all .15s; }
  .item.done .item-check { background:var(--done); border-color:var(--done); }
  .item.done .item-check::after { content:"✓"; color:#fff; font-weight:700; font-size:.8rem; }
  .item-title-area { flex:1; min-width:0; }
  .item-title { font-size:1rem; font-weight:700; margin:0; overflow-wrap:anywhere; }
  .item.done .item-title { text-decoration:line-through; color:var(--muted); }
  .item-meta { margin-top:.2rem; display:flex; flex-wrap:wrap; gap:.4rem; }
  .badge { display:inline-block; padding:0 8px; border-radius:999px; font-size:.8rem; font-weight:700; }
  .badge-admin { background:#dbeafe; color:var(--c-admin); }
  .badge-medical { background:#fce7f3; color:var(--c-medical); }
  .badge-work { background:#f3f4f6; color:var(--c-work); }
  .badge-money { background:#fef3c7; color:var(--c-money); }
  .badge-family { background:#d1fae5; color:var(--c-family); }
  .badge-life { background:#ede9fe; color:var(--c-life); }
  .badge-deadline { background:#fee2e2; color:var(--danger); }
  .badge-check { background:#fff3cd; color:#a16207; }
  .icons { display:flex; gap:.4rem; flex-shrink:0; }
  .ico { width:2rem; height:2rem; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.25rem; text-decoration:none; border:1px solid var(--border); background:#fff; }
  .ico.web { background:#eff6ff; border-color:#bfdbfe; }
  .ico.map { background:#ecfdf5; border-color:#a7f3d0; }
  .ico.tel { background:#fff7ed; border-color:#fed7aa; }
  .item-detail { display:none; padding:.5rem 1rem 1.1rem 1rem; font-size:.95rem; background:#fafaf8; border-top:1px solid var(--border); }
  .item.open .item-detail { display:block; }
  .item-detail h4 { margin:.9rem 0 .3rem; font-size:.85rem; color:var(--muted); letter-spacing:.5px; font-family:'Jua',sans-serif; }
  .item-detail h4:first-child { margin-top:.4rem; }
  .item-detail ul, .item-detail ol { margin:.3rem 0; padding-left:1.2rem; }
  .item-detail li { margin-bottom:.25rem; }
  .item-detail p { margin:.3rem 0; }
  .note { background:#fff8e6; border-left:3px solid var(--warn); padding:.5rem .8rem; margin:.7rem 0; font-size:.9rem; border-radius:4px; }
  .danger-note { background:#fee2e2; border-left:3px solid var(--danger); padding:.5rem .8rem; margin:.7rem 0; font-size:.9rem; border-radius:4px; }
  .go { display:flex; flex-direction:column; gap:.45rem; margin-top:.5rem; }
  .go a { display:flex; align-items:center; gap:.6rem; padding:.55rem .8rem; border-radius:10px; text-decoration:none; color:var(--text); border:1px solid var(--border); background:#fff; font-size:.95rem; font-weight:700; }
  .go a small { display:block; font-weight:400; color:var(--muted); font-size:.8rem; line-height:1.3; }
  .go a.web { border-color:#bfdbfe; background:#eff6ff; }
  .go a.map { border-color:#a7f3d0; background:#ecfdf5; }
  .go a.tel { border-color:#fed7aa; background:#fff7ed; }
  .go a .g { font-size:1.3rem; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; padding:1.5rem 1rem; border-top:1px solid var(--border); margin-top:1.5rem; }
  .baby-items { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  .baby-item { position:absolute; top:-50px; opacity:.5; animation:babyFall linear infinite; will-change:transform; }
  @keyframes babyFall { 0%{transform:translateY(-10vh) rotate(0)} 50%{transform:translateY(50vh) rotate(180deg) translateX(20px)} 100%{transform:translateY(110vh) rotate(360deg) translateX(-20px)} }
  @media (prefers-reduced-motion: reduce) { .baby-items { display:none; } }
</style>

<div class="container">

<script>
// 지도 링크: 네이버 지도 검색 (휴대폰에서는 네이버지도 앱이 있으면 앱으로 열림)
const naverMap = q => "https://map.naver.com/p/search/" + encodeURIComponent(q);

// 자주 쓰는 장소
const PLACE = {
  center: { label:"고천동 행정복지센터", sub:"경기 의왕시 사천로 11 · 평일 9~18시", q:"의왕시 고천동 행정복지센터" },
  health: { label:"의왕시 보건소", sub:"모자보건 · 유축기 · BCG · 예방접종", q:"의왕시보건소" },
  pedi:   { label:"주변 소아과", sub:"BCG·영유아 검진 예약 후 방문", q:"의왕시 고천동 소아과" },
  moon:   { label:"달빛어린이병원 (야간·휴일)", sub:"야간 진료 소아과 위치 미리 저장", q:"의왕시 달빛어린이병원" },
  er:     { label:"소아 응급실", sub:"야간·휴일 대비", q:"의왕시 소아응급실" }
};
const LINK = {
  gov24:   { label:"정부24 행복출산 원스톱", sub:"출생신고 + 첫만남·부모급여·아동수당 한 번에", url:"https://www.gov.kr/portal/onestopSvc/happyBirth" },
  center:  { label:"고천동 행정복지센터 홈페이지", sub:"", url:"https://www.uiwang.go.kr/gocheon/index" },
  work24:  { label:"고용24", sub:"배우자 출산휴가·육아휴직 급여 신청", url:"https://www.work24.go.kr" },
  child:   { label:"아이사랑 (어린이집 입소 대기)", sub:"", url:"https://www.childcare.go.kr" },
  bokjiro: { label:"복지로", sub:"", url:"https://www.bokjiro.go.kr" },
  nhis:    { label:"국민건강보험", sub:"피부양자 등록 · 1577-1000", url:"https://www.nhis.or.kr" },
  notice:  { label:"의왕시 보건소 공지 (모자보건사업)", sub:"경기도 산후조리비 12월 말 출생아까지", url:"https://www.uiwang.go.kr/heal/UWHEAL0501/7005305" },
  kepco:   { label:"한전 사이버지점", sub:"출산가구 전기요금 감면", url:"https://cyber.kepco.co.kr" },
  hometax: { label:"홈택스", sub:"연말정산·세액공제", url:"https://www.hometax.go.kr" }

const TEL = {
  center: { label:"고천동 행정복지센터", sub:"031-345-3121", num:"0313453121" },
  nhis:   { label:"국민건강보험공단", sub:"1577-1000", num:"15771000" },
  labor:  { label:"고용노동부 상담센터", sub:"1350", num:"1350" }
};

const DATA = [
  { title:"🟦 출산 전 (D-14 ~ D-day)", items:[
    { id:"p1", title:"배우자 출산휴가·육아휴직, 회사에 미리 확정", cats:["work"], deadline:"D-14일",
      go:[TEL.labor],
      detail:`
        <h4>전달할 내용</h4>
        <ol>
          <li>배우자 출산휴가 <b>20일</b> (3회까지 분할, 출산 후 120일 안에 사용)</li>
          <li>육아휴직 의사 (6+6 부모육아휴직제 가능한지)</li>
          <li>인수인계 계획</li>
        </ol>
        <h4>인사팀에 확인할 것</h4>
        <ul>
          <li>우선지원대상기업 여부 (급여 지급 주체가 달라짐)</li>
          <li>사규가 10일로 남아 있어도 법정 20일 적용되는지</li>
          <li>배우자 출산휴가 확인서 발급 가능 여부</li>
        </ul>
        <div class="note">⚠️ 20일 확대 시행일은 자료마다 달랐습니다(2025년 2월 / 2026년 8월 20일). 고용노동부(1350)나 고용24로 확인하세요.</div>` },
    { id:"p2", title:"차 카시트 설치 + 병원~집 이동 연습", cats:["life"], deadline:"D-14일", go:[],
      detail:`<p>귀가 때 법적으로 필수. 미리 설치하고 한 번 시연해 두세요.</p><ul><li>차 세차</li><li>벨트/ISOFIX 단단히 고정 확인</li></ul>` },
    { id:"p3", title:"병원·조리원 동선, 출산 가방 확인", cats:["life","family"], deadline:"D-14일", go:[PLACE.pedi, PLACE.er],
      detail:`
        <h4>가방</h4>
        <ul><li>산모수첩·신분증·건강보험증</li><li>산모 패드·슬리퍼·긴 충전기</li><li>신생아: 속싸개·겉싸개·배냇저고리·기저귀</li></ul>
        <h4>지도에 저장</h4>
        <p>야간·휴일에 갈 수 있는 소아과와 응급실을 네이버 지도에 즐겨찾기 해 두세요.</p>` },
    { id:"p4", title:"출생신고 서류·도장 위치 정리", cats:["admin"], deadline:"D-14일", go:[],
      detail:`
        <ul>
          <li>부부 신분증</li>
          <li>지원금 받을 통장 사본</li>
          <li>아기 이름 확정 (한자 이름은 선택)</li>
          <li>가족관계증명서</li>
        </ul>` },
    { id:"p5", title:"보건소 유축기 대여 문의·예약", cats:["medical"], deadline:"퇴소일에 맞춰", go:[PLACE.health],
      detail:`<p>조리원 퇴소일에 맞춰 대여할 수 있게 의왕시 보건소 모자보건팀에 전화로 문의하세요.</p><div class="note">⚠️ 대여 조건·대수는 확인하지 못했습니다. 전화 문의 필요.</div>` }
  ]},
  { title:"🟥 출산 당일 ~ 퇴원", items:[
    { id:"b1", title:"산모 첫 보행 부축, 아기 팔찌 확인", cats:["family","medical"], deadline:"당일", go:[],
      detail:`<p>출산 직후 혈전 예방을 위해 첫 보행 때 곁에서 부축하세요. 신생아실에서 아기 팔찌 정보가 맞는지 확인하세요.</p>` },
    { id:"b2", title:"양가 부모님·교회·회사에 소식 알리기", cats:["family"], deadline:"당일", go:[],
      detail:`<ol><li>양가 부모님 (전화)</li><li>형제자매·친지</li><li>교회</li><li>회사 직속 상사</li></ol><p>면회는 산모 회복을 위해 1~2일 뒤로 조율.</p>` },
    { id:"b3", title:"퇴원 전 원무과 서류 받기", cats:["admin"], deadline:"퇴원 전", go:[],
      detail:`
        <ul>
          <li><b>출생증명서 2매</b> (출생신고용 + 여분)</li>
          <li>진료비 영수증</li>
          <li>진료비 세부내역서 (실손보험·연말정산용)</li>
        </ul>
        <div class="danger-note">출생증명서 없이는 출생신고가 안 됩니다. 퇴원 전에 꼭 수령!</div>` },
    { id:"b4", title:"소아과 BCG 접종·영유아 검진 예약", cats:["medical"], deadline:"생후 4주 이내", go:[PLACE.pedi, PLACE.health],
      detail:`<p>BCG는 생후 4주 이내. 영유아 1차 건강검진은 생후 14~35일. 지도에서 가까운 소아과를 찾아 전화 예약하세요.</p>` },
    { id:"b5", title:"조리원·산후도우미 퇴원일·방문 일정 확정", cats:["life"], deadline:"퇴원 전", go:[],
      detail:`<p>입소일·퇴소일, 도우미 첫 방문일이 겹치거나 비지 않는지 확인하세요.</p>` }
  ]},
  { title:"🟨 출생신고 ~ 1개월 이내", note:"⏰ 출생신고 기한: <b>출생일로부터 1개월 이내</b>. 조리원에 있는 동안 평일에 한 번에 끝내세요!", items:[
    { id:"c1", title:"고천동 행정복지센터 방문: 출생신고 + 원스톱 신청", cats:["admin","money"], deadline:"1개월 이내",
      go:[PLACE.center, LINK.gov24, TEL.center],
      detail:`
        <h4>⚠️ 가장 중요한 한 번의 방문</h4>
        <p>출생신고를 하면 아기 주민등록번호가 나오고, 아래 혜택을 같이 신청할 수 있습니다. 온라인(정부24 행복출산 원스톱)도 가능합니다.</p>
        <h4>준비물</h4>
        <ul>
          <li>출생증명서 원본</li>
          <li>부부 신분증</li>
          <li>아기 이름 (한자는 선택)</li>
          <li>가족관계증명서</li>
          <li>지원금 받을 통장 사본</li>
        </ul>
        <h4>한 번에 신청</h4>
        <ul>
          <li>첫만남이용권: 첫째 200만 원 (국민행복카드 포인트, 2년 사용)</li>
          <li>부모급여: 만 0세 월 100만 원 (매달 25일)</li>
          <li>아동수당: 월 10만 원</li>
          <li>의왕시 출산장려금: 첫째 100만 원 (6개월 이상 거주)</li>
        </ul>
        <div class="note">⚠️ 방문 전 031-345-3121로 신청 가능 항목과 필요 서류를 확인하면 헛걸음을 줄일 수 있습니다.</div>` },
    { id:"c2", title:"경기도 산후조리비 50만 원 신청", cats:["money"], deadline:"12월 말 출생아까지",

// ----- 렌더링 -----
const KEY = "dad-birth-checklist-v2";
let state = {}, collapsed = {}, onlyGo = false;
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
try { collapsed = JSON.parse(localStorage.getItem(KEY + "-c")) || {}; } catch (e) {}
const save = () => { localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem(KEY + "-c", JSON.stringify(collapsed)); };
const catName = { admin:"행정", medical:"의료", work:"회사", money:"지원금", family:"가족", life:"생활" };

function goAnchor(g) {
  if (g.q)   return { cls:"map", icon:"🗺️", href:naverMap(g.q), label:g.label, sub:g.sub, tel:false };
  if (g.url) return { cls:"web", icon:"🔗", href:g.url, label:g.label, sub:g.sub, tel:false };
  return { cls:"tel", icon:"📞", href:"tel:" + g.num, label:g.label + " 전화", sub:g.sub, tel:true };
}

const root = document.getElementById("checklist");
DATA.forEach((sec, si) => {
  const el = document.createElement("div");
  el.className = "section" + (collapsed[si] ? " collapsed" : "");
  el.innerHTML = `<div class="section-header"><span>${sec.title}</span><span class="section-progress" id="sp${si}"></span></div><div class="section-body"></div>`;
  el.querySelector(".section-header").onclick = () => {
    el.classList.toggle("collapsed");
    collapsed[si] = el.classList.contains("collapsed");
    save();
  };
  const body = el.querySelector(".section-body");
  if (sec.note) body.insertAdjacentHTML("beforeend", `<div class="section-note">${sec.note}</div>`);

  sec.items.forEach(it => {
    const gos = (it.go || []).map(goAnchor);
    if (it.tel) gos.push(goAnchor(it.tel));
    const firstWeb = gos.find(g => g.cls === "web"), firstMap = gos.find(g => g.cls === "map"), firstTel = gos.find(g => g.cls === "tel");
    const icons = [firstWeb, firstMap, firstTel].filter(Boolean)
      .map(g => `<a class="ico ${g.cls}" href="${g.href}" ${g.tel ? "" : 'target="_blank" rel="noopener"'} title="${g.label}" aria-label="${g.label}">${g.icon}</a>`).join("");
    const goBlock = gos.length ? `<h4>바로가기</h4><div class="go">${gos.map(g =>
      `<a class="${g.cls}" href="${g.href}" ${g.tel ? "" : 'target="_blank" rel="noopener"'}><span class="g">${g.icon}</span><span>${g.label}${g.sub ? "<small>" + g.sub + "</small>" : ""}</span></a>`).join("")}</div>` : "";
    const hasConfirm = /⚠️/.test(it.detail);

    const d = document.createElement("div");
    d.className = "item" + (state[it.id] ? " done" : "");
    d.dataset.go = gos.length ? "1" : "";
    d.innerHTML = `
      <div class="item-header">
        <div class="item-check"></div>
        <div class="item-title-area">
          <p class="item-title">${it.title}</p>
          <div class="item-meta">
            ${it.cats.map(c => `<span class="badge badge-${c}">${catName[c]}</span>`).join("")}
            ${it.deadline ? `<span class="badge badge-deadline">⏰ ${it.deadline}</span>` : ""}
            ${hasConfirm ? '<span class="badge badge-check">⚠️ 확인</span>' : ""}
          </div>
        </div>
        <div class="icons">${icons}</div>
      </div>
      <div class="item-detail">${it.detail}${goBlock}</div>`;
    const header = d.querySelector(".item-header");
    // 체크박스는 체크, 제목 영역은 펼침/접힘
    d.querySelector(".item-check").onclick = e => {
      e.stopPropagation();
      state[it.id] = !state[it.id];
      d.classList.toggle("done", !!state[it.id]);
      save(); update();
    };
    header.onclick = () => d.classList.toggle("open");
    d.querySelectorAll(".icons a").forEach(a => a.addEventListener("click", e => e.stopPropagation()));
    body.append(d);
  });
  root.append(el);
});

function update() {
  let total = 0, done = 0;
  DATA.forEach((sec, si) => {
    let d = 0;
    sec.items.forEach(it => { total++; if (state[it.id]) { done++; d++; } });
    document.getElementById("sp" + si).textContent = d + "/" + sec.items.length;
  });
  document.getElementById("progressBar").style.width = (done / total * 100) + "%";
  document.getElementById("progressText").textContent = done + " / " + total + " 완료";
}
function toggleAll(collapse) {
  document.querySelectorAll(".section").forEach((s, i) => { s.classList.toggle("collapsed", collapse); collapsed[i] = collapse; });
  document.querySelectorAll(".item").forEach(i => i.classList.toggle("open", !collapse));
  save();
}
function toggleOnlyGo() {
  onlyGo = !onlyGo;
  document.getElementById("onlyGo").classList.toggle("on", onlyGo);
  document.querySelectorAll(".item").forEach(i => i.classList.toggle("hidden", onlyGo && !i.dataset.go));
}
function resetAll() {
  if (!confirm("모든 체크를 해제할까요?")) return;
  state = {}; save();
  document.querySelectorAll(".item").forEach(i => i.classList.remove("done"));
  update();
}

// 떨어지는 아기용품
(function () {
  const box = document.getElementById("babyItems"), emojis = ["🍼","🧸","👶","🧷","🎀","🍪","🌸"];
  for (let i = 0; i < 10; i++) {
    const s = document.createElement("span");
    s.className = "baby-item";
    s.textContent = emojis[i % emojis.length];
    s.style.left = Math.random() * 95 + "%";
    s.style.fontSize = (18 + Math.random() * 14) + "px";
    s.style.animationDuration = (14 + Math.random() * 14) + "s";
    s.style.animationDelay = (-Math.random() * 20) + "s";
    box.append(s);
  }
})();
update();
</script>
